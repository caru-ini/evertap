name: Image

# The container image for Linux (amd64 and arm64), made from the binaries attached to a release, so
# the image runs what the release ships. The release workflow calls this once the release exists.
on:
  workflow_call:
    inputs:
      release:
        description: The tag of the GitHub release to take the binaries from
        required: true
        type: string
      tags:
        description: The image's tags, separated by spaces
        required: true
        type: string

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # download the release
      packages: write # push the image
      id-token: write # sign the attestation
      attestations: write # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ inputs.release }}
        run: |
          mkdir build
          cd build
          gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern 'evertap-linux-*.tar.gz' --pattern SHA256SUMS
          sha256sum --check --ignore-missing SHA256SUMS
          for archive in evertap-linux-*.tar.gz; do
            tar -xzf "$archive"
          done
      # The Dockerfile only copies files, so both platforms build here without emulation.
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          args=()
          for tag in $TAGS; do
            args+=(--tag "$image:$tag")
          done
          # GHCR reads a multi-arch image's description from its index, not from the labels.
          args+=(
            --annotation "index:org.opencontainers.image.description=Databases and object storage handed out from one box on your home server or VPS"
            --annotation "index:org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            --annotation "index:org.opencontainers.image.licenses=Apache-2.0"
          )
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --file contrib/docker/Dockerfile \
            "${args[@]}" --push --metadata-file metadata.json build
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' metadata.json)" >> "$GITHUB_OUTPUT"
      # Attestations need a public repository on GitHub's Free, Pro, and Team plans.
      - if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.build.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
