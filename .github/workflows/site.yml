name: Site

# Deploys evertap.dev to Cloudflare Workers from develop, when a push affects the site (turbo
# --affected: the site, docs/, or a package it reads), or by hand. The Cloudflare token is in
# apps/site/.env.production, encrypted with dotenvx; only its decryption key is a secret.
on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --affected compares with the commit before the push.
          fetch-depth: 0
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.9.18
      - run: pnpm install --frozen-lockfile
      # The deploy script builds the site, then runs `cf` under dotenvx with the decrypted token.
      - env:
          DOTENV_PRIVATE_KEY_PRODUCTION: ${{ secrets.DOTENV_PRIVATE_KEY_PRODUCTION }}
          AFFECTED: ${{ github.event_name == 'push' && 'true' || '' }}
        run: pnpm turbo run deploy --filter=site ${AFFECTED:+--affected}
